name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cd ../.. && python -m pip install .
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: cd ../.. && python scripts/export_static_dashboard.py
      - run: npm run build
        env:
          VITE_BASE_PATH: /wastewater-watch/
          VITE_STATIC_MODE: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
